<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Skills">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071512"/>
    <stop offset="1" stop-color="#0c211b"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<rect width="1200" height="760" rx="20" fill="url(#bg)"/>
<circle cx="1080" cy="80" r="100" fill="#4fb7a2" opacity=".07" filter="url(#soft)"/>
<circle cx="80" cy="700" r="120" fill="#79c8b6" opacity=".045" filter="url(#soft)"/>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="60" y="62" fill="#e9f1ed" font-size="26" font-weight="700">SKILLS</text>
  <text x="60" y="90" fill="#8ea39c" font-size="14">Core technologies actively used or hands-on experience.</text>

  <!-- Cards -->
  <g fill="#0a1d18" stroke="#21483e" stroke-width="1">
    <rect x="60" y="120" width="520" height="150" rx="16"/>
    <rect x="620" y="120" width="520" height="150" rx="16"/>
    <rect x="60" y="290" width="520" height="150" rx="16"/>
    <rect x="620" y="290" width="520" height="150" rx="16"/>
    <rect x="60" y="460" width="520" height="150" rx="16"/>
    <rect x="620" y="460" width="520" height="150" rx="16"/>
  </g>

  <!-- Category labels -->
  <g fill="#79c8b6" font-size="14" font-weight="700">
    <text x="84" y="151">BACKEND</text>
    <text x="644" y="151">FRONTEND</text>
    <text x="84" y="321">DATA</text>
    <text x="644" y="321">INTEGRATIONS</text>
    <text x="84" y="491">DEVOPS AND QUALITY</text>
    <text x="644" y="491">WAYS OF WORKING</text>
  </g>

  <!-- Backend -->
  <g fill="#dce9e4" font-size="14">
    <text x="84" y="181">PHP 8 · Laravel 5.8 to 12 · Laravel Nova</text>
    <text x="84" y="207">Horizon and queues · REST APIs · CodeIgniter 4</text>
    <text x="84" y="233">NetSuite SuiteScript</text>
  </g>

  <!-- Frontend -->
  <g fill="#dce9e4" font-size="14">
    <text x="644" y="181">Vue.js 2 and 3 · Inertia.js · JavaScript</text>
    <text x="644" y="207">Tailwind CSS · jQuery · Axios · HTML · CSS</text>
  </g>

  <!-- Data -->
  <g fill="#dce9e4" font-size="14">
    <text x="84" y="351">MySQL (views, query optimization, N+1 elimination)</text>
    <text x="84" y="377">Redis · multi-tenant databases · bulk CSV and Excel</text>
    <text x="84" y="403">import/export · Power BI feeds</text>
  </g>

  <!-- Integrations -->
  <g fill="#dce9e4" font-size="14">
    <text x="644" y="351">Salesforce · PayPal subscriptions · PayMaya</text>
    <text x="644" y="377">Google OAuth and SSO · Firebase Cloud Messaging</text>
    <text x="644" y="403">SFTP ingestion · AWS S3 · MinIO</text>
  </g>

  <!-- DevOps and quality -->
  <g fill="#dce9e4" font-size="14">
    <text x="84" y="521">Docker · Jenkins · CI/CD</text>
    <text x="84" y="547">Git (GitHub, GitLab, Bitbucket) · PHPUnit · PHPStan</text>
    <text x="84" y="573">PHP_CodeSniffer · Laravel Pint</text>
  </g>

  <!-- Ways of working -->
  <g fill="#dce9e4" font-size="14">
    <text x="644" y="521">Agile and Scrum · Jira · technical design specs</text>
    <text x="644" y="547">code review · QA test plans</text>
    <text x="644" y="573">AI-assisted development with Claude Code</text>
  </g>

  <path d="M60 660H1140" stroke="#21483e" stroke-width="1"/>
  <circle cx="60" cy="660" r="4" fill="#4fb7a2"/>
  <text x="60" y="695" fill="#aabbb5" font-size="14">Laravel / PHP · application architecture · APIs · business systems</text>
</g>
</svg>